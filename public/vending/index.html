<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e35332">
  <title>Zai Vending Machine — Thoughts In, Strange Things Out</title>
  <link rel="stylesheet" href="/vending/machine.css">
</head>
<body>
  <a class="skip-link" href="#machine">Skip to machine</a>
  <header class="site-head">
    <a class="wordmark" href="/vending/" aria-label="Zai Vending Machine home">
      <span class="wordmark-mark">Z</span>
      <span>ZAI VENDING MACHINE</span>
    </a>
    <div class="head-meta">
      <span id="profileSignal" class="signal"><i></i> CALIBRATING</span>
      <a href="https://zayyyseuc.github.io/portfolio/" target="_blank" rel="noopener noreferrer">ZAI'S PORTFOLIO ↗</a>
    </div>
  </header>

  <main id="machine" class="stage">
    <section class="intro" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Insert a thought.<br><em>Collect a strange object.</em></h1>
    </section>

    <div class="machine-parallax-shell">
      <section class="vending-machine" aria-label="Interactive vending machine">
      <div class="machine-top">
        <span>ZVM / 01</span>
        <span class="live-light"><i></i> ONLINE</span>
      </div>

      <div class="machine-body">
        <div class="cabinet">
          <div class="cabinet-glass">
            <div class="glass-label"><span>SELECT ONE</span></div>
            <div class="product-grid" role="radiogroup" aria-label="Choose a product">
              <button class="product selected" role="radio" aria-checked="true" data-product="reality_check">
                <span class="coil" aria-hidden="true"></span>
                <span class="pack pack-reality">
                  <small>A–01</small><b>REALITY<br>CHECK</b>
                </span>
              </button>
              <button class="product" role="radio" aria-checked="false" data-product="unexpected_connection">
                <span class="coil" aria-hidden="true"></span>
                <span class="pack pack-connection">
                  <small>B–02</small><b>ODD<br>LINK</b>
                </span>
              </button>
              <button class="product" role="radio" aria-checked="false" data-product="wild_card">
                <span class="coil" aria-hidden="true"></span>
                <span class="pack pack-wild">
                  <small>C–??</small><b>WILD<br>CARD</b>
                </span>
              </button>
            </div>
          </div>
        </div>

        <div class="console">
          <div class="screen" aria-live="polite">
            <div class="screen-head"><span>INPUT TERMINAL</span><span id="charCount">0000 / 1200</span></div>
            <div id="screenMessage" class="screen-message">01 — INSERT A THOUGHT.</div>
            <div class="meter"><i id="meterFill"></i></div>
          </div>

          <label class="input-module">
            <span>YOUR THOUGHT</span>
            <textarea id="thoughtInput" maxlength="1200" rows="5" placeholder="Type here…"></textarea>
            <span class="slot-mouth" aria-hidden="true"><i></i></span>
          </label>

          <section id="calibrationPanel" class="calibration-panel" aria-live="polite" hidden>
            <div class="calibration-head">
              <span id="calibrationStep">ORDER SLIP</span>
              <button id="calibrationReset" type="button">START OVER</button>
            </div>
            <ol id="agentLog" class="agent-log" aria-label="Order progress" hidden></ol>
            <p id="calibrationText"></p>
            <div id="calibrationDraft" class="calibration-draft" hidden>
              <b id="calibrationDraftTitle"></b>
              <span id="calibrationDraftBody"></span>
            </div>
            <div id="calibrationOptions" class="calibration-options"></div>
            <label class="calibration-reply">
              <span id="calibrationReplyLabel">YOUR ANSWER</span>
              <textarea id="calibrationReply" maxlength="600" rows="3" placeholder="Add the missing detail…"></textarea>
            </label>
            <button id="calibrationKeep" class="calibration-keep" type="button" hidden>KEEP MY ORDER</button>
            <div class="calibration-actions">
              <button id="calibrationSecondary" type="button">YOU DECIDE</button>
              <button id="calibrationContinue" type="button">ANSWER</button>
            </div>
          </section>

          <div class="controls">
            <button id="surpriseButton" class="surprise-button" type="button">
              <span>?</span> SURPRISE ME
            </button>
            <div class="lever-panel">
              <div class="lever-copy"><b id="leverLabel">PULL TO CALIBRATE</b></div>
              <button id="lever" class="lever" type="button" aria-label="Pull lever to calibrate">
                <span class="lever-track"><i class="lever-stem"></i><b class="lever-knob"></b></span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="machine-bottom">
        <div id="collectionBay" class="collection-bay" tabindex="-1">
          <span class="bay-label">COLLECT HERE</span>
          <div class="bay-door"><span id="dropObject" class="drop-object"></span><i></i></div>
        </div>
      </div>
      <div class="machine-feet" aria-hidden="true"><i></i><i></i></div>
      </section>
    </div>

  </main>

  <div id="artifactOverlay" class="artifact-overlay" hidden>
    <div class="overlay-scrim" data-close></div>
    <article id="artifact" class="artifact" role="dialog" aria-modal="true" aria-labelledby="artifactTitle">
      <button class="artifact-close" type="button" data-close aria-label="Close artifact">×</button>
      <div class="artifact-kicker"><span id="artifactLabel">PRODUCT</span><span id="artifactSerial">NO. 0000</span></div>
      <div class="artifact-mark" aria-hidden="true">“</div>
      <h2 id="artifactTitle"></h2>
      <div class="artifact-rule" aria-hidden="true"></div>
      <p id="artifactMessage"></p>
      <div class="artifact-sign">— ZVM-01</div>
      <div class="artifact-notes">
        <div id="artifactTrace" class="artifact-trace" hidden></div>
        <div id="artifactFacts" class="artifact-facts" hidden></div>
      </div>
      <div class="artifact-actions">
        <button id="copyButton" type="button">COPY</button>
        <button id="saveButton" type="button">SAVE OBJECT</button>
        <button id="againButton" class="primary-action" type="button">DISPENSE AGAIN</button>
      </div>
    </article>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/vending/machine.js" defer></script>
</body>
</html>
